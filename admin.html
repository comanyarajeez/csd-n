<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم - إصدار تصريح أمني</title>
    <style>
        :root { --bg: #f0f2f5; --card-bg: #fff; --primary: #1a3e5c; --border: #ccc; --accent: #c9a84c; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; border-bottom: 3px double var(--primary); padding-bottom: 10px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; }
        .section h3 { color: var(--primary); margin-bottom: 10px; font-size: 1.1em; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .form-row label { min-width: 120px; font-weight: bold; font-size: 0.9em; color: #333; }
        .form-row input, .form-row textarea { flex: 1; padding: 8px; border: 1px solid #bbb; border-radius: 4px; font-family: inherit; font-size: 0.9em; }
        .form-row textarea { min-height: 60px; resize: vertical; }
        .dynamic-list { margin-top: 10px; }
        .person-row, .vehicle-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background: #fff; padding: 6px; border: 1px dashed #ccc; border-radius: 4px; }
        .person-row input, .vehicle-row input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 3px; font-size: 0.85em; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
        .btn-add { background: #e8f0fe; color: #1a3e5c; border: 1px solid #1a3e5c; }
        .btn-remove { background: #ffe0e0; color: #c00; border: 1px solid #c00; padding: 5px 10px; font-size: 0.8em; }
        .btn-issue { background: #1a3e5c; color: white; width: 100%; padding: 15px; font-size: 1.2em; margin-top: 20px; }
        .btn-issue:hover { background: #2a5a7c; }
        #result-area { margin-top: 20px; padding: 15px; display: none; }
        .success { background: #d4edda; border: 2px solid #28a745; padding: 20px; text-align: center; border-radius: 5px; }
        .success a { color: #1a3e5c; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>🛡️ إصدار تصريح أمني جديد - المنطقة الجنوبية</h2>
        
        <!-- بيانات التصريح الأساسية -->
        <div class="section">
            <h3>📋 بيانات التصريح</h3>
            <div class="form-row"><label>رقم التصريح:</label><input type="number" id="permitNo" placeholder="مثال: 22452"></div>
            <div class="form-row"><label>اسم الشركة (عربي):</label><input type="text" id="companyAr" placeholder="شركة نسيم الارجوان..."></div>
            <div class="form-row"><label>اسم الشركة (إنجليزي):</label><input type="text" id="companyEn" placeholder="Nassem Alarjan"></div>
            <div class="form-row"><label>المواقع المسموحة:</label><textarea id="locations" placeholder="خور الزبير - مقر شركة غاز البصرة..."></textarea></div>
            <div class="form-row">
                <label>تاريخ البداية:</label><input type="date" id="startDate">
                <label>تاريخ النهاية:</label><input type="date" id="endDate">
            </div>
            <div class="form-row"><label>جهة الإصدار:</label><input type="text" id="issuer" value="شعبة التصاريح الأمنية - المنطقة الجنوبية"></div>
        </div>

        <!-- المنتسبين العراقيين -->
        <div class="section">
            <h3>👥 المنتسبين العراقيين</h3>
            <div id="persons-list" class="dynamic-list"></div>
            <button class="btn-add" onclick="addPerson()">➕ إضافة منتسب</button>
        </div>

        <!-- العجلات -->
        <div class="section">
            <h3>🚛 العجلات</h3>
            <div id="vehicles-list" class="dynamic-list"></div>
            <button class="btn-add" onclick="addVehicle()">➕ إضافة عجلة</button>
        </div>

        <button class="btn-issue" onclick="issuePermit()">📄 إصدار التصريح ونشره</button>

        <div id="result-area"></div>
    </div>

    <script>
        let personCounter = 1;
        let vehicleCounter = 1;

        function addPerson() {
            const container = document.getElementById('persons-list');
            const row = document.createElement('div');
            row.className = 'person-row';
            row.innerHTML = `
                <input type="text" placeholder="الاسم الرباعي" class="p-name">
                <input type="number" placeholder="الرقم" class="p-num" style="width:80px;">
                <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>`;
            container.appendChild(row);
        }

        function addVehicle() {
            const container = document.getElementById('vehicles-list');
            const row = document.createElement('div');
            row.className = 'vehicle-row';
            row.innerHTML = `
                <input type="text" placeholder="اسم ورقم العجلة والنوع" class="v-desc" style="flex:3;">
                <input type="text" placeholder="تسلسل" class="v-seq" style="width:80px;">
                <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>`;
            container.appendChild(row);
        }

        function issuePermit() {
            const permitNo = document.getElementById('permitNo').value.trim();
            if (!permitNo) { alert('الرجاء إدخال رقم التصريح'); return; }

            // تجميع البيانات
            const persons = [];
            document.querySelectorAll('.person-row').forEach(row => {
                const name = row.querySelector('.p-name')?.value.trim();
                const num = row.querySelector('.p-num')?.value.trim();
                if (name) persons.push({ name, num });
            });

            const vehicles = [];
            document.querySelectorAll('.vehicle-row').forEach(row => {
                const desc = row.querySelector('.v-desc')?.value.trim();
                const seq = row.querySelector('.v-seq')?.value.trim();
                if (desc) vehicles.push({ desc, seq });
            });

            const permitData = {
                id: permitNo,
                companyAr: document.getElementById('companyAr').value.trim(),
                companyEn: document.getElementById('companyEn').value.trim(),
                locations: document.getElementById('locations').value.trim(),
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                issuer: document.getElementById('issuer').value.trim(),
                persons: persons,
                vehicles: vehicles,
                issuedAt: new Date().toISOString()
            };

            // تخزين في localStorage لمحاكاة قاعدة بيانات (في الإصدار الحقيقي، ارفع data.json)
            let allPermits = JSON.parse(localStorage.getItem('permits') || '{}');
            allPermits[permitNo] = permitData;
            localStorage.setItem('permits', JSON.stringify(allPermits));

            // رابط العرض
            const viewUrl = `view.html?id=${permitNo}`;
            
            // عرض النتيجة
            const resultDiv = document.getElementById('result-area');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="success">
                    <h3>✅ تم إصدار التصريح بنجاح!</h3>
                    <p><strong>رقم التصريح:</strong> ${permitNo}</p>
                    <p><strong>رابط التحقق:</strong> <a href="${viewUrl}" target="_blank">${viewUrl}</a></p>
                    <p style="margin-top:15px; font-size:0.9em; color:#555;">
                        ⚠️ ملاحظة: لتوليد QR Code، انسخ الرابط أعلاه واستخدم أي موقع توليد QR.<br>
                        في النسخة الكاملة، يتم توليد QR تلقائياً ورفع الملفات إلى Vercel.
                    </p>
                </div>`;
            
            // حفظ نسخة JSON للتحميل
            const blob = new Blob([JSON.stringify(permitData, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `permit_${permitNo}.json`;
            a.click();
            
            alert(`تم حفظ بيانات التصريح. الرابط: ${viewUrl}\n\nلطباعة PDF: استخدم المتصفح (Ctrl+P) على صفحة view.html`);
        }

        // إضافة صف أول فارغ
        addPerson();
        addVehicle();
    </script>
</body>
</html>
