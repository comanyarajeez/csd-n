<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تصريح جاهز للتنزيل</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Segoe UI", Tahoma, Arial, "Arial Unicode MS", sans-serif;
    background:
        radial-gradient(circle at 50% 45%, rgba(24, 55, 78, .28), transparent 55%),
        linear-gradient(135deg, #081526 0%, #10253a 50%, #071326 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 52px 27px 80px;
}

.container {
    width: 100%;
    max-width: 640px;
    padding: 40px 32px 34px;
    text-align: center;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.075);
    border-radius: 48px;
    box-shadow:
        0 22px 55px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.025);
}

.logo-section {
    margin-bottom: 35px;
}

.logo-section img {
    display: block;
    width: 212px;
    height: 212px;
    max-width: 100%;
    margin: 0 auto;
    object-fit: cover;
    border-radius: 37px;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.28));
}

h1 {
    font-size: 34px;
    line-height: 1.35;
    color: #fff;
    margin: 30px 0 16px;
    font-weight: 600;
    text-shadow: 0 2px 5px rgba(0,0,0,.3);
}

.subtitle {
    color: #a9b9c9;
    font-size: 18px;
    line-height: 1.85;
    margin: 0 8px 35px;
}

.permit-card {
    background: rgba(255,255,255,.052);
    border: 1px solid rgba(255,255,255,.105);
    border-radius: 25px;
    padding: 20px 22px 21px;
    margin-bottom: 16px;
    min-height: 124px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.card-label {
    color: #8fa1b2;
    font-size: 16px;
    line-height: 1.4;
    margin-bottom: 7px;
    font-weight: 400;
}

.card-value {
    color: #fff;
    font-size: 27px;
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: .15px;
}

.download-section {
    margin-top: 41px;
}

.download-btn {
    width: 100%;
    min-height: 98px;
    border: 0;
    border-radius: 25px;
    padding: 18px 28px;
    background: linear-gradient(135deg, #12b9aa 0%, #08a6e4 100%);
    color: #06192b;
    font-family: inherit;
    font-size: 22px;
    line-height: 1.35;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(0, 184, 215, .22);
    transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
}

.download-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.04);
    box-shadow: 0 15px 34px rgba(0, 184, 215, .28);
}

.download-btn:active {
    transform: translateY(0);
}

.info-text {
    color: #8194a7;
    font-size: 16px;
    line-height: 1.7;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.09);
}

@media (max-width: 600px) {
    body {
        padding: 52px 27px 70px;
    }

    .container {
        padding: 40px 32px 34px;
        border-radius: 48px;
    }
}

@media (max-width: 480px) {
    body {
        padding-left: 20px;
        padding-right: 20px;
    }

    .container {
        padding: 32px 20px 30px;
        border-radius: 42px;
    }

    .logo-section img {
        width: 210px;
        height: 210px;
    }

    h1 {
        font-size: 31px;
    }

    .subtitle {
        font-size: 16px;
    }

    .permit-card {
        min-height: 120px;
        padding: 18px;
    }

    .card-label {
        font-size: 15px;
    }

    .card-value {
        font-size: 25px;
    }

    .download-btn {
        min-height: 92px;
        font-size: 20px;
    }
}

/* Screen-fit layout: match the compact single-screen mobile design */
html, body {
    min-height: 100%;
}
body {
    min-height: 100svh;
    height: 100svh;
    overflow: hidden;
    padding: 22px 20px 18px;
    align-items: center;
}
.container {
    max-width: 640px;
    padding: 28px 20px 20px;
    border-radius: 42px;
}
.logo-section { margin-bottom: 22px; }
.logo-section img { width: 150px; height: 150px; border-radius: 30px; }
h1 { font-size: 31px; margin: 18px 0 10px; }
.subtitle { font-size: 16px; line-height: 1.65; margin: 0 6px 20px; }
.permit-card {
    min-height: 86px;
    padding: 13px 18px 14px;
    margin-bottom: 10px;
    border-radius: 22px;
}
.card-label { font-size: 14px; margin-bottom: 4px; }
.card-value { font-size: 24px; line-height: 1.25; }
.download-section { margin-top: 20px; }
.download-btn { min-height: 72px; border-radius: 22px; padding: 14px 20px; font-size: 20px; }
.info-text { font-size: 14px; line-height: 1.5; margin-top: 10px; padding-top: 10px; }
@media (max-width: 480px) {
    body { padding: 18px 14px 14px; }
    .container { padding: 24px 14px 16px; border-radius: 38px; }
    .logo-section { margin-bottom: 18px; }
    .logo-section img { width: 142px; height: 142px; }
    h1 { font-size: 29px; margin: 15px 0 8px; }
    .subtitle { font-size: 15px; line-height: 1.55; margin-bottom: 16px; }
    .permit-card { min-height: 78px; padding: 11px 16px 12px; margin-bottom: 8px; }
    .card-label { font-size: 13px; }
    .card-value { font-size: 22px; }
    .download-section { margin-top: 16px; }
    .download-btn { min-height: 66px; font-size: 19px; }
    .info-text { font-size: 13px; margin-top: 8px; padding-top: 8px; }
}


/* Final polish: subtle motion + right-aligned Arabic text + single-screen fit */
@keyframes pageIn {
    from { opacity: 0; transform: translateY(12px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes cardIn {
    from { opacity: 0; transform: translateX(18px); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes softFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}
@keyframes buttonGlow {
    0%, 100% { box-shadow: 0 12px 30px rgba(0,184,215,.22); }
    50% { box-shadow: 0 15px 36px rgba(0,184,215,.34); }
}

body { overflow: hidden; }
.container {
    animation: pageIn .65s cubic-bezier(.22,.8,.25,1) both;
}
.logo-section img {
    animation: softFloat 4s ease-in-out infinite;
}
.permit-card {
    text-align: right;
    direction: rtl;
    animation: cardIn .55s cubic-bezier(.22,.8,.25,1) both;
}
.permit-card:nth-of-type(2) { animation-delay: .08s; }
.permit-card:nth-of-type(3) { animation-delay: .16s; }
.permit-card:nth-of-type(4) { animation-delay: .24s; }
.permit-card:nth-of-type(5) { animation-delay: .32s; }
.card-label, .card-value { text-align: right; }
.download-btn { animation: buttonGlow 3s ease-in-out infinite; }

@media (max-width: 600px) {
    body {
        height: 100svh;
        min-height: 100svh;
        padding: 14px 14px 12px;
        align-items: center;
    }
    .container {
        max-height: calc(100svh - 26px);
        padding: 18px 14px 13px;
        border-radius: 34px;
    }
    .logo-section { margin-bottom: 10px; }
    .logo-section img { width: 128px; height: 128px; border-radius: 27px; }
    h1 { font-size: 27px; margin: 10px 0 6px; line-height: 1.25; }
    .subtitle { font-size: 14px; line-height: 1.45; margin: 0 4px 11px; }
    .permit-card {
        min-height: 65px;
        padding: 9px 14px 10px;
        margin-bottom: 6px;
        border-radius: 19px;
    }
    .card-label { font-size: 13px; line-height: 1.25; margin-bottom: 2px; }
    .card-value { font-size: 21px; line-height: 1.22; }
    .download-section { margin-top: 11px; }
    .download-btn {
        min-height: 57px;
        border-radius: 19px;
        padding: 11px 16px;
        font-size: 18px;
    }
    .info-text { font-size: 12px; line-height: 1.35; margin-top: 6px; padding-top: 6px; }
}

@media (max-height: 760px) {
    body { padding-top: 8px; padding-bottom: 8px; }
    .container { padding-top: 13px; padding-bottom: 10px; }
    .logo-section img { width: 105px; height: 105px; }
    .logo-section { margin-bottom: 6px; }
    h1 { font-size: 24px; margin: 7px 0 4px; }
    .subtitle { font-size: 12px; margin-bottom: 7px; }
    .permit-card { min-height: 55px; padding: 7px 12px; margin-bottom: 5px; }
    .card-label { font-size: 11px; }
    .card-value { font-size: 18px; }
    .download-section { margin-top: 8px; }
    .download-btn { min-height: 49px; font-size: 16px; }
    .info-text { font-size: 10px; margin-top: 4px; padding-top: 4px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}



/* حركة خفيفة للصفحة كلها للأعلى والأسفل */
@keyframes pageFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
.container {
    animation: pageFloat 4.5s ease-in-out infinite;
    will-change: transform;
}
@media (prefers-reduced-motion: reduce) {
    .container { animation: none; }
}
</style>
</head>
