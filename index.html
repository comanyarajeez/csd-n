<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="controls">
  <input id="name" placeholder="Full Name">
  <input id="title" placeholder="Job Title">
  <input id="machine" placeholder="Machine / Model">
  <input id="date1" placeholder="Exam Date">
  <input id="date2" placeholder="Valid Until">
  <input type="file" id="photo">
  <input type="file" id="qr">
  <button onclick="generate()">Generate</button>
  <button onclick="window.print()">Save PDF</button>
</div>

<div class="certificate">
  <div class="name" id="c-name"></div>
  <div class="title" id="c-title"></div>
  <div class="machine" id="c-machine"></div>
  <div class="date1" id="c-date1"></div>
  <div class="date2" id="c-date2"></div>
  <img class="photo" id="c-photo">
  <img class="qr" id="c-qr">
</div>

<script>
function generate(){
  c-name.innerText=name.value;
  c-title.innerText=title.value;
  c-machine.innerText=machine.value;
  c-date1.innerText=date1.value;
  c-date2.innerText=date2.value;
  if(photo.files[0]) c-photo.src=URL.createObjectURL(photo.files[0]);
  if(qr.files[0]) c-qr.src=URL.createObjectURL(qr.files[0]);
}
</script>

</body>
</html>
